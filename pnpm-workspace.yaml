packages:
  - .

# 重複排除
dedupePeers: true

catalog:
  date-fns: 5.0.0-alpha.0
  iso8601-duration: 2.1.4
  rolldown: 1.2.6
  rolldown-plugin-dts: 0.28.3
  typescript: 7.0.2
  vitest: &vitest_ver 4.1.11
  '@biomejs/biome': 2.5.11
  '@date-fns/tz': 1.5.0
  '@fast-check/vitest': 0.4.1
  '@types/node': 26.4.0
  '@vitest/coverage-v8': *vitest_ver

overrides:
  rolldown: 'catalog:'

# リリースから一定時間経過していないか、信頼性低下したパッケージはインストールしない
minimumReleaseAge: 2880 # 2d
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# 特殊なソースからの依存関係をインストールしない
blockExoticSubdeps: true
